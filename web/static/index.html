<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetAudit — Network Security Scanner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container { max-width: 900px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 40px; }
    header h1 { font-size: 2.2rem; color: #58a6ff; }
    header p { color: #8b949e; margin-top: 8px; }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }

    label { display: block; margin-bottom: 6px; color: #8b949e; font-size: 0.9rem; }

    input, select {
      width: 100%;
      padding: 10px 14px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 1rem;
      margin-bottom: 16px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #58a6ff;
    }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    button {
      width: 100%;
      padding: 12px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #2ea043; }
    button:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }

    .score-card {
      text-align: center;
      padding: 32px;
    }

    .score-number {
      font-size: 4rem;
      font-weight: bold;
      color: #58a6ff;
    }

    .score-label { font-size: 1.2rem; margin-top: 8px; }

    .risk-critical { color: #f85149; }
    .risk-high     { color: #ff7b72; }
    .risk-medium   { color: #e3b341; }
    .risk-low      { color: #3fb950; }
    .risk-info     { color: #8b949e; }

    .findings h3 {
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #30363d;
    }

    .finding-item {
      background: #0d1117;
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 10px;
      border-left: 3px solid #30363d;
    }

    .finding-item.critical { border-left-color: #f85149; }
    .finding-item.high     { border-left-color: #ff7b72; }
    .finding-item.medium   { border-left-color: #e3b341; }
    .finding-item.low      { border-left-color: #3fb950; }

    .finding-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .finding-ip { font-weight: bold; font-family: monospace; }

    .badge {
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge-critical { background: #f8514930; color: #f85149; }
    .badge-high     { background: #ff7b7230; color: #ff7b72; }
    .badge-medium   { background: #e3b34130; color: #e3b341; }
    .badge-low      { background: #3fb95030; color: #3fb950; }

    .cve-list { margin-top: 8px; }
    .cve-item { font-size: 0.85rem; color: #8b949e; margin-top: 4px; }
    .cve-item span { color: #58a6ff; font-family: monospace; }

    .status-bar {
      text-align: center;
      padding: 12px;
      color: #8b949e;
      font-size: 0.9rem;
    }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #results { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔍 NetAudit</h1>
      <p>Network Security Scanner for Small Businesses</p>
    </header>

    <div class="card">
      <div>
        <label>Target IP or Range</label>
        <input type="text" id="target" placeholder="e.g. 192.168.1.1-192.168.1.254" />
      </div>
      <div class="row">
        <div>
          <label>Ports</label>
          <input type="text" id="ports" value="22,80,443" />
        </div>
        <div>
          <label>Workers</label>
          <input type="number" id="workers" value="100" min="10" max="500" />
        </div>
      </div>
      <button id="scanBtn" onclick="startScan()">Start Scan</button>
    </div>

    <div class="status-bar" id="status"></div>

    <div id="results">
      <div class="card score-card">
        <div class="score-number" id="scoreNum">--</div>
        <div class="score-label" id="scoreLabel"></div>
        <div style="margin-top:16px; color:#8b949e; font-size:0.9rem" id="scoreMeta"></div>
      </div>

      <div class="card findings" id="findingsCard"></div>
    </div>
  </div>

  <script>
    async function startScan() {
      const target  = document.getElementById('target').value.trim()
      const ports   = document.getElementById('ports').value.trim()
      const workers = parseInt(document.getElementById('workers').value)
      const btn     = document.getElementById('scanBtn')
      const status  = document.getElementById('status')

      if (!target) {
        alert('Please enter a target IP or range')
        return
      }

      btn.disabled = true
      document.getElementById('results').style.display = 'none'
      status.innerHTML = '<span class="spinner"></span> Scanning network... this may take a minute'

      try {
        const resp = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ target, ports, workers })
        })

        const data = await resp.json()

        if (!data.success) {
          status.textContent = '❌ Error: ' + data.error
          return
        }

        renderReport(data.report)
        status.textContent = '✅ Scan complete'
        document.getElementById('results').style.display = 'block'

      } catch (err) {
        status.textContent = '❌ Request failed: ' + err.message
      } finally {
        btn.disabled = false
      }
    }

    function renderReport(r) {
      const critical = r.Critical || []
      const high     = r.High     || []
      const medium   = r.Medium   || []
      const low      = r.Low      || []

      document.getElementById('scoreNum').textContent   = r.Score + '/100'
      document.getElementById('scoreLabel').textContent = r.RiskLabel
      document.getElementById('scoreMeta').textContent  =
        `${r.Total} services checked · ${critical.length} critical · ${high.length} high · ${medium.length} medium`

      const card = document.getElementById('findingsCard')
      card.innerHTML = '<h3>Findings</h3>'

      const all = [
        ...critical.map(f => ({...f, risk: 'critical'})),
        ...high.map(f     => ({...f, risk: 'high'})),
        ...medium.map(f   => ({...f, risk: 'medium'})),
        ...low.map(f      => ({...f, risk: 'low'})),
      ]

      if (all.length === 0) {
        card.innerHTML += '<p style="color:#8b949e; margin-top:12px">No vulnerabilities found.</p>'
        return
      }

      all.forEach(f => {
        const cveHtml = (f.CVEs || []).map(c =>
          `<div class="cve-item"><span>${c.ID}</span> [${c.Score}] — ${c.Description}</div>`
        ).join('')

        card.innerHTML += `
          <div class="finding-item ${f.risk}">
            <div class="finding-header">
              <span class="finding-ip">${f.IP}:${f.Port} — ${f.Service} ${f.Version}</span>
              <span class="badge badge-${f.risk}">${f.risk.toUpperCase()}</span>
            </div>
            <div class="cve-list">${cveHtml}</div>
          </div>`
      })
    }
  </script>
</body>
</html>
